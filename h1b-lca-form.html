<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>H-1B LCA Candidate Details</title>
<style>
  :root {
    --ink: #1a2238;
    --muted: #6b7280;
    --line: #e3e6ee;
    --accent: #1f5fa8;
    --accent-dark: #143f73;
    --bg: #f4f6fb;
    --card: #ffffff;
    --danger: #b42318;
    --ok: #0f7a4d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
    padding: 24px 16px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  .header {
    background: var(--accent);
    color: #fff;
    border-radius: 14px 14px 0 0;
    padding: 22px 24px;
  }
  .header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
  .header p { margin: 0; font-size: 13px; opacity: 0.92; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-top: none;
    border-radius: 0 0 14px 14px;
    padding: 24px;
  }
  .field { margin-bottom: 18px; }
  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
  }
  label .req { color: var(--danger); }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 2px; }
  input, select {
    width: 100%;
    padding: 11px 12px;
    font-size: 15px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font-family: inherit;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(31,95,168,0.15);
  }
  .row { display: flex; gap: 14px; }
  .row .field { flex: 1; }
  button {
    width: 100%;
    padding: 13px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 8px;
    cursor: pointer;
    margin-top: 6px;
  }
  button:hover { background: var(--accent-dark); }
  button:disabled { opacity: 0.6; cursor: default; }
  .msg { font-size: 13px; margin-top: 12px; text-align: center; }
  .msg.err { color: var(--danger); }
  .msg.ok { color: var(--ok); }
  .done { text-align: center; padding: 30px 10px; }
  .done h2 { color: var(--ok); margin: 0 0 8px; }
  .footer { text-align: center; font-size: 11px; color: var(--muted); margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>H-1B LCA Candidate Details</h1>
    <p>Please fill all fields accurately. Used for H-1B LCA filing.</p>
  </div>
  <div class="card" id="card">
    <form id="form" novalidate>
      <div class="field">
        <label>Full name <span class="req">*</span></label>
        <div class="hint">As shown on your passport</div>
        <input name="name" type="text" required />
      </div>

      <div class="field">
        <label>Home / residence location <span class="req">*</span></label>
        <input name="home" type="text" placeholder="City, State, ZIP" required />
      </div>

      <div class="field">
        <label>Work location / LCA worksite <span class="req">*</span></label>
        <input name="work" type="text" placeholder="City, State, ZIP" required />
      </div>

      <div class="field">
        <label>SOC code (H-1B registration) <span class="req">*</span></label>
        <div class="hint">e.g. 15-1252 Software Developers</div>
        <input name="soc" type="text" required />
      </div>

      <div class="row">
        <div class="field">
          <label>Highest degree <span class="req">*</span></label>
          <select name="degree" required>
            <option value="">Select</option>
            <option>Associate</option>
            <option>Bachelor's</option>
            <option>Master's</option>
            <option>Doctorate (PhD)</option>
            <option>Other</option>
          </select>
        </div>
        <div class="field">
          <label>Field of study <span class="req">*</span></label>
          <input name="field" type="text" placeholder="e.g. Computer Science" required />
        </div>
      </div>

      <div class="row">
        <div class="field">
          <label>Days in office / week <span class="req">*</span></label>
          <input name="office" type="number" min="0" max="7" required />
        </div>
        <div class="field">
          <label>Days WFH / week <span class="req">*</span></label>
          <input name="wfh" type="number" min="0" max="7" required />
        </div>
      </div>

      <button type="submit" id="submitBtn">Submit details</button>
      <div class="msg" id="msg"></div>
    </form>
  </div>
  <div class="footer">Your information is submitted securely to the employer.</div>
</div>

<script>
  // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL BETWEEN THE QUOTES BELOW
  var ENDPOINT = "PASTE_YOUR_WEB_APP_URL_HERE";

  var form = document.getElementById('form');
  var msg = document.getElementById('msg');
  var btn = document.getElementById('submitBtn');
  var card = document.getElementById('card');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    msg.className = 'msg';
    msg.textContent = '';

    var data = {};
    var inputs = form.querySelectorAll('input, select');
    var missing = false;
    inputs.forEach(function (el) {
      data[el.name] = (el.value || '').trim();
      if (el.required && !data[el.name]) missing = true;
    });

    if (missing) {
      msg.className = 'msg err';
      msg.textContent = 'Please fill in all required fields.';
      return;
    }

    var office = parseInt(data.office || 0, 10);
    var wfh = parseInt(data.wfh || 0, 10);
    if (office + wfh > 7) {
      msg.className = 'msg err';
      msg.textContent = 'Office days + WFH days cannot exceed 7.';
      return;
    }

    if (ENDPOINT === "PASTE_YOUR_WEB_APP_URL_HERE") {
      msg.className = 'msg err';
      msg.textContent = 'Form not configured yet: add your Google Apps Script URL.';
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Submitting...';

    fetch(ENDPOINT, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(data)
    }).then(function () {
      card.innerHTML = '<div class="done"><h2>&#10003; Thank you!</h2><p>Your details have been submitted successfully.</p></div>';
    }).catch(function () {
      btn.disabled = false;
      btn.textContent = 'Submit details';
      msg.className = 'msg err';
      msg.textContent = 'Something went wrong. Please try again.';
    });
  });
</script>
</body>
</html>
